[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-generator"
version = "0.1.0"
description = "Synthetic attendance report generation"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
    "python-bidi>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pymupdf>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
